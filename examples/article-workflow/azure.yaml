# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: article-workflow
requiredVersions:
  azd: '>=1.37.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.23'
    azure.ai.projects: '>=1.0.0-beta.16'
infra:
  provider: microsoft.foundry
services:
  ai-project:
    host: azure.ai.project
    # New projects get workspace-backed Insights + a project AppInsights connection.
    # Do not add endpoint unless deliberately adopting an existing project.
    monitoring:
      enabled: true
    deployments:
      - name: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        model:
          format: OpenAI
          name: ${ARTICLE_MODEL_NAME}
          version: ${ARTICLE_MODEL_VERSION}
        sku:
          name: ${ARTICLE_MODEL_SKU}
          capacity: 10
  article-workflow:
    host: azure.ai.agent
    project: .
    language: docker
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: article-workflow
    description: Three-agent SQL article processing workflow with private Blob output and trace replay.
    protocols:
      - protocol: responses
        version: 2.0.0
    container:
      resources:
        cpu: '1'
        memory: 2Gi
    env:
      # Foundry injects FOUNDRY_PROJECT_ENDPOINT and APPLICATIONINSIGHTS_CONNECTION_STRING.
      PYTHONNOUSERSITE: '1'
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_SQL_CONNECTION_STRING: ${AZURE_SQL_CONNECTION_STRING}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL}
      AZURE_STORAGE_CONTAINER: articles
      OTEL_SERVICE_NAME: article-workflow
      ENABLE_SENSITIVE_DATA: 'false'
